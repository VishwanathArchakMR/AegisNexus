[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegisnexus-sdk"
version = "0.2.0"
description = "AegisNexus Python SDK — Runtime Security, Telemetry, and Governance for Autonomous AI Agents"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "AegisNexus Security Engineering Team" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["aegisnexus_sdk"]

